    <rect x="24" y="35" width="64" height="10" rx="2"/>
    <rect x="52" y="51" width="36" height="10" rx="2"/>
    <rect x="16" y="66" width="72" height="4" rx="1" opacity="0.72"/>
    <rect x="16" y="76" width="72" height="4" rx="1"/>
    <rect x="16" y="82" width="72" height="4" rx="1"/>
  </g>
</svg>
